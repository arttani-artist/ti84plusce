<script>
let expr = "";
let cursor = 0;
let lastAns = 0;

const exprEl = document.getElementById("expr-display");
const resultEl = document.getElementById("result-display");

function render() {
  let before = expr.slice(0, cursor);
  let after = expr.slice(cursor);

  exprEl.innerHTML =
    before +
    '<span style="background:#1a2e10;width:6px;display:inline-block;">&nbsp;</span>' +
    after;

  resultEl.textContent = expr ? "" : "0";
}

function insert(val) {
  expr = expr.slice(0, cursor) + val + expr.slice(cursor);
  cursor += val.length;
  render();
}

function press(key) {
  if (key === "CLEAR") {
    expr = "";
    cursor = 0;
    render();
    return;
  }

  if (key === "DEL") {
    if (cursor > 0) {
      expr = expr.slice(0, cursor - 1) + expr.slice(cursor);
      cursor--;
    }
    render();
    return;
  }

  if (key === "LEFT") {
    cursor = Math.max(0, cursor - 1);
    render();
    return;
  }

  if (key === "RIGHT") {
    cursor = Math.min(expr.length, cursor + 1);
    render();
    return;
  }

  if (key === "ENTER") {
    try {
      let e = expr
        .replace(/×/g, "*")
        .replace(/÷/g, "/")
        .replace(/−/g, "-")
        .replace(/\^/g, "**")
        .replace(/sin\(/g, "Math.sin(")
        .replace(/cos\(/g, "Math.cos(")
        .replace(/tan\(/g, "Math.tan(")
        .replace(/log\(/g, "Math.log10(")
        .replace(/ln\(/g, "Math.log(");

      let res = Function("return " + e)();

      lastAns = res;
      resultEl.textContent = res;

      expr = "";
      cursor = 0;
    } catch {
      resultEl.textContent = "ERR";
      expr = "";
      cursor = 0;
    }
    return;
  }

  if (key === "ANS") {
    insert(String(lastAns));
    return;
  }

  insert(key);
}

document.querySelectorAll("[data-key]").forEach(btn => {
  btn.addEventListener("click", () => {
    press(btn.dataset.key);
  });
});

render();
</script>
