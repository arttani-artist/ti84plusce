<!DOCTYPE html>

<script>
let expr = "";
let cursor = 0;
let lastAns = 0;

const exprEl = document.getElementById("expr-display");
const resultEl = document.getElementById("result-display");

const keyMap = {
  ADD: "+",
  SUB: "-",
  MUL: "*",
  DIV: "/",
  DOT: ".",
  LPAREN: "(",
  RPAREN: ")",
  POW: "**",
  SIN: "Math.sin(",
  COS: "Math.cos(",
  TAN: "Math.tan(",
  LOG: "Math.log10(",
  LN: "Math.log(",
  SQ: "**2"
};

function render() {
  let before = expr.slice(0, cursor);
  let after = expr.slice(cursor);

  exprEl.innerHTML =
    before +
    '<span style="background:#1a2e10;width:6px;display:inline-block;">&nbsp;</span>' +
    after;

  resultEl.textContent = expr ? "" : "0";
}

function insert(val) {
  expr = expr.slice(0, cursor) + val + expr.slice(cursor);
  cursor += val.length;
  render();
}

function press(key) {
  if (key === "CLEAR") {
    expr = "";
    cursor = 0;
    render();
    return;
  }

  if (key === "DEL") {
    if (cursor > 0) {
      expr = expr.slice(0, cursor - 1) + expr.slice(cursor);
      cursor--;
    }
    render();
    return;
  }

  if (key === "LEFT") {
    cursor = Math.max(0, cursor - 1);
    render();
    return;
  }

  if (key === "RIGHT") {
    cursor = Math.min(expr.length, cursor + 1);
    render();
    return;
  }

  if (key === "ENTER") {
    try {
      let result = Function("return " + expr)();
      lastAns = result;
      resultEl.textContent = result;
      expr = "";
      cursor = 0;
    } catch {
      resultEl.textContent = "ERR";
      expr = "";
      cursor = 0;
    }
    return;
  }

  if (key === "ANS") {
    insert(String(lastAns));
    return;
  }

  let val = keyMap[key] ?? key;

  if (/^\d$/.test(key)) val = key;

  insert(val);
}

document.querySelectorAll("[data-key]").forEach(btn => {
  btn.addEventListener("click", () => {
    press(btn.dataset.key);
  });
});

render();
</script>
</html>
